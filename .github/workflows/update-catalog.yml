name: Update discount catalog

on:
  schedule:
    # Субота 06:00 UTC (~09:00 Київ) — перевірено живим запуском (16.08.2026),
    # коли саме кожен магазин оновлює тижневі знижки:
    #   АТБ    — середа (лічильник "До кінця акції" на сайті добігав до 00:00 саме в ніч з вівторка на середу)
    #   Сільпо — четвер (офіційний текст на сайті: "щочетверга з'являються цінотижики")
    #   Novus  — четвер (найбільший пул позицій на sales.html стартував із четверга)
    #   Фора   — п'ятниця (найбільший пул позицій на all-offers стартував із п'ятниці)
    # Субота — з запасом після найпізнішого з чотирьох (п'ятниці Фори), щоб
    # жоден магазин не потрапив у каталог зі знижками попереднього тижня.
    - cron: "0 6 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-catalog
  cancel-in-progress: false

jobs:
  scrape-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Scrape stores
        run: node scrape.js

      - name: Build catalog.html
        run: node build.js

      - name: Copy catalog as index.html for GitHub Pages
        run: cp catalog.html index.html

      - name: Commit updated catalog + photo library
        run: |
          git config user.name "catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          git add catalog.html index.html data images
          git diff --cached --quiet || git commit -m "Оновлення каталогу знижок $(date -u +%Y-%m-%d)"
          git push
